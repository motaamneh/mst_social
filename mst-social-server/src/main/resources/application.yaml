spring:
  application:
    name: mst_social
  datasource:
    url: ${MST_DB_URL:jdbc:postgresql://localhost:5432/mst_social_db}
    username: ${MST_DB_USERNAME}
    password: ${MST_DB_PASSWORD}
    hikari:
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never

mst:
  searchapi:
    api-key: ${SEARCHAPI_API_KEY:}
    connect-timeout: 5s
    request-timeout: 20s
    max-response-bytes: 1048576
  verification:
    active-key-version: v1
    keys:
      v1: ${MST_VERIFICATION_KEY_V1:}
