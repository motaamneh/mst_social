spring:
  application:
    name: mst_social
  datasource:
    url: ${MST_DB_URL:jdbc:postgresql://localhost:5432/mst_social_db}
    username: ${MST_DB_USERNAME}
    password: ${MST_DB_PASSWORD}
    hikari:
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

springdoc:
  api-docs:
    enabled: ${mst.api-docs.enabled}
    version: OPENAPI_3_1
  swagger-ui:
    enabled: ${mst.api-docs.enabled}
    persist-authorization: false
    disable-swagger-default-url: true
    validator-url: ""
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  packages-to-scan: com.motaamneh.mstsocial.server.web
  paths-to-match: /api/v1/**
  override-with-generic-response: false

mst:
  api-docs:
    enabled: ${MST_API_DOCS_ENABLED:false}
  api:
    rate-limits:
      create-per-minute: 10
      verify-per-minute: 10
      read-per-minute: 120
      mutation-per-minute: 30
  tenant-api-keys:
    hash-key: ${MST_TENANT_API_KEY_HASH_KEY:}
  searchapi:
    api-key: ${SEARCHAPI_API_KEY:}
    connect-timeout: 5s
    request-timeout: 20s
    max-response-bytes: 1048576
  verification:
    active-key-version: v1
    keys:
      v1: ${MST_VERIFICATION_KEY_V1:}

logging:
  level:
    com.motaamneh.mstsocial.server: ${MST_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [httpRequestId=%X{httpRequestId:-none} tenantId=%X{tenantId:-none}] [%thread] %logger{36} : %msg %kvp%n%wEx"
  structured:
    format:
      console: ${MST_LOG_FORMAT:}
