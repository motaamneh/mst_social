components:
  schemas:
    CreateVerificationRequest:
      type: object
      additionalProperties: false
      description: Create a verification for a user in your application. Tenant identity
        comes from the API key.
      properties:
        subjectId:
          type: string
          description: Your application user ID; nonblank and without ASCII control
            characters.
          example: user-123
          maxLength: 128
          minLength: 1
          pattern: "[^\\x00-\\x1F\\x7F]*"
        platform:
          type: string
          description: INSTAGRAM and TIKTOK are supported. X and FACEBOOK return 422;
            unknown enum values return 400.
          enum:
          - INSTAGRAM
          - FACEBOOK
          - X
          - TIKTOK
          example: INSTAGRAM
        handle:
          type: string
          description: "Social username, optionally prefixed by @. Platform validation\
            \ follows normalization."
          example: '@your_username'
          maxLength: 256
          minLength: 1
      required:
      - handle
      - platform
      - subjectId
    VerificationCreatedResponse:
      type: object
      description: New verification. The code appears only in this response; save
        it securely until it is placed in the bio.
      properties:
        requestId:
          type: string
          format: uuid
          description: Verification request UUID.
          example: 00000000-0000-4000-8000-000000000001
        code:
          type: string
          description: "Exact verification marker returned once. Example is illustrative,\
            \ not a usable verification code."
          example: mst-ig-EXAMPLE_ONLY
        expiresAt:
          type: string
          format: date-time
          description: "Verification deadline (default: 15 minutes after creation)."
          example: 2026-10-18T12:15:00Z
        instructions:
          type: string
          description: Instructions for the user.
          example: "Add this exact code to your social profile bio, then submit a\
            \ verification attempt before expiry."
      required:
      - code
      - expiresAt
      - instructions
      - requestId
    ApiErrorResponse:
      type: object
      description: "Safe problem details. Optional fields are omitted when absent;\
        \ security errors may contain only type, title, status, and code."
      properties:
        type:
          type: string
          format: uri
          description: Problem type URI.
          example: about:blank
        title:
          type: string
          description: HTTP status title.
          example: Bad Request
        status:
          type: integer
          format: int32
          description: HTTP error status.
          example: 400
          maximum: 599
          minimum: 400
        code:
          type: string
          description: Stable machine-readable error code.
          example: VALIDATION_FAILED
        detail:
          type: string
          description: Safe explanation; omitted by security responses.
          example: One or more request fields are invalid.
        errors:
          type: array
          description: Present for request field validation errors.
          items:
            $ref: "#/components/schemas/FieldErrorResponse"
        verification:
          $ref: "#/components/schemas/VerificationResponse"
          description: Current verification state.
        providerFailure:
          $ref: "#/components/schemas/ProviderFailureResponse"
          description: Present when profile evidence could not be fetched or used.
      required:
      - code
      - status
      - title
      - type
    FieldErrorResponse:
      type: object
      description: A validation failure without the rejected input value.
      properties:
        field:
          type: string
          description: Invalid request field.
          example: subjectId
        message:
          type: string
          description: Validation explanation.
          example: must not be blank
      required:
      - field
      - message
    ProviderFailureResponse:
      type: object
      description: Provider failure details. A provider failure does not increment
        the bio mismatch count.
      properties:
        reason:
          type: string
          description: Reason provider evidence was unavailable.
          enum:
          - PROFILE_NOT_FOUND
          - PROFILE_UNAVAILABLE
          - PROVIDER_RATE_LIMITED
          - PROVIDER_AUTHENTICATION_FAILED
          - PROVIDER_TIMEOUT
          - INVALID_PROVIDER_RESPONSE
          - UNSUPPORTED_PLATFORM
          - PROVIDER_ERROR
          example: PROVIDER_TIMEOUT
        retryable:
          type: boolean
          description: Whether the provider failure can be retried while the request
            remains eligible.
          example: true
        retryAfterSeconds:
          type: integer
          format: int64
          description: Optional provider-supplied delay in seconds (1–86400).
          example: 30
          maximum: 86400
          minimum: 1
      required:
      - reason
      - retryable
    VerificationResponse:
      type: object
      description: "Current verification state without the code, digest, bio, or internal\
        \ attempt lease."
      example:
        requestId: 00000000-0000-4000-8000-000000000001
        subjectId: user-123
        platform: INSTAGRAM
        normalizedHandle: your_username
        status: PENDING
        failedAttempts: 0
        maxFailedAttempts: 10
        createdAt: 2026-10-18T12:00:00Z
        expiresAt: 2026-10-18T12:15:00Z
        verifiedAt: null
        canceledAt: null
      properties:
        requestId:
          type: string
          format: uuid
          description: Verification request UUID.
          example: 00000000-0000-4000-8000-000000000001
        subjectId:
          type: string
          description: User ID in the consuming application.
          example: user-123
        platform:
          type: string
          description: Social platform.
          enum:
          - INSTAGRAM
          - FACEBOOK
          - X
          - TIKTOK
          example: INSTAGRAM
        normalizedHandle:
          type: string
          description: Validated normalized requested username.
          example: your_username
        status:
          type: string
          description: Current state; mismatch 10 locks the request under the default
            policy.
          enum:
          - PENDING
          - VERIFYING
          - VERIFIED
          - EXPIRED
          - CANCELED
          - LOCKED
          example: PENDING
        failedAttempts:
          type: integer
          format: int32
          description: Number of bio mismatches; provider failures do not increase
            this count.
          example: 0
          minimum: 0
        maxFailedAttempts:
          type: integer
          format: int32
          description: Mismatch limit; default is 10.
          example: 10
          minimum: 1
        createdAt:
          type: string
          format: date-time
          description: Creation time in UTC.
          example: 2026-10-18T12:00:00Z
        expiresAt:
          type: string
          format: date-time
          description: "Verification deadline (default: 15 minutes after creation)."
          example: 2026-10-18T12:15:00Z
        verifiedAt:
          type:
          - string
          - "null"
          format: date-time
          description: Successful verification time; null on an unverified request.
          example: 2026-10-18T12:02:00Z
        canceledAt:
          type:
          - string
          - "null"
          format: date-time
          description: "Cancellation time, or null if not canceled."
      required:
      - canceledAt
      - createdAt
      - expiresAt
      - failedAttempts
      - maxFailedAttempts
      - normalizedHandle
      - platform
      - requestId
      - status
      - subjectId
      - verifiedAt
    VerificationAttemptResponse:
      type: object
      description: "Successful verification, including the associated account. Failed\
        \ attempts use ApiErrorResponse."
      example:
        outcome: VERIFIED
        verification:
          requestId: 00000000-0000-4000-8000-000000000001
          subjectId: user-123
          platform: INSTAGRAM
          normalizedHandle: your_username
          status: VERIFIED
          failedAttempts: 0
          maxFailedAttempts: 10
          createdAt: 2026-10-18T12:00:00Z
          expiresAt: 2026-10-18T12:15:00Z
          verifiedAt: 2026-10-18T12:02:00Z
          canceledAt: null
        account:
          accountId: 00000000-0000-4000-8000-000000000002
          subjectId: user-123
          platform: INSTAGRAM
          canonicalHandle: your_username
          providerAccountId: null
          evidenceProvider: searchapi
          verifiedAt: 2026-10-18T12:02:00Z
          validUntil: 2027-10-18T12:02:00Z
          revokedAt: null
          active: true
      properties:
        outcome:
          type: string
          description: Successful outcomes only; failures use the problem response.
          enum:
          - VERIFIED
          - ALREADY_VERIFIED
          example: VERIFIED
        verification:
          $ref: "#/components/schemas/VerificationResponse"
          description: Current verification state.
        account:
          $ref: "#/components/schemas/VerifiedAccountResponse"
          description: Associated social identity. Check active even for ALREADY_VERIFIED.
      required:
      - account
      - outcome
      - verification
    VerifiedAccountResponse:
      type: object
      description: Historical account association; active reflects expiry and revocation
        at the time of the response.
      example:
        accountId: 00000000-0000-4000-8000-000000000002
        subjectId: user-123
        platform: INSTAGRAM
        canonicalHandle: your_username
        providerAccountId: null
        evidenceProvider: searchapi
        verifiedAt: 2026-10-18T12:02:00Z
        validUntil: 2027-10-18T12:02:00Z
        revokedAt: null
        active: true
      properties:
        accountId:
          type: string
          format: uuid
          description: Verified association UUID; use this for social-identity endpoints.
          example: 00000000-0000-4000-8000-000000000002
        subjectId:
          type: string
          description: User ID in the consuming application.
          example: user-123
        platform:
          type: string
          description: Social platform.
          enum:
          - INSTAGRAM
          - FACEBOOK
          - X
          - TIKTOK
          example: INSTAGRAM
        canonicalHandle:
          type: string
          description: Username confirmed by the provider.
          example: your_username
        providerAccountId:
          type:
          - string
          - "null"
          description: Stable platform account ID if supplied; currently may be null.
            Handles can change.
        evidenceProvider:
          type: string
          description: Provider used to retrieve profile evidence.
          example: searchapi
        verifiedAt:
          type: string
          format: date-time
          description: Time this account association was verified.
          example: 2026-10-18T12:02:00Z
        validUntil:
          type: string
          format: date-time
          description: Association expiry; default is one calendar year after verification.
          example: 2027-10-18T12:02:00Z
        revokedAt:
          type:
          - string
          - "null"
          format: date-time
          description: "Revocation time, or null if not revoked."
        active:
          type: boolean
          description: True only while the association is valid and not revoked.
          example: true
      required:
      - accountId
      - active
      - canonicalHandle
      - evidenceProvider
      - platform
      - providerAccountId
      - revokedAt
      - subjectId
      - validUntil
      - verifiedAt
    TenantIdentityResponse:
      type: object
      description: Identity derived from the authenticated tenant credential.
      properties:
        tenantId:
          type: string
          format: uuid
          description: Application tenant UUID; inferred from the credential.
          example: 00000000-0000-4000-8000-000000000010
        credentialId:
          type: string
          format: uuid
          description: UUID of the API key used for this call.
          example: 00000000-0000-4000-8000-000000000020
      required:
      - credentialId
      - tenantId
  securitySchemes:
    tenantKey:
      type: http
      description: Paste the complete tenant API key without the Bearer prefix. This
        is not a JWT. Provision keys with the tenant-key CLI. Keep them on your application
        backend.
      scheme: bearer
      bearerFormat: mst_api_<credential-uuid>.<secret>
