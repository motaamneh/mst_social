openapi: 3.1.0
info:
  title: MST Social verification API
  description: |
    Verify control of Instagram and TikTok accounts through a code in the profile bio.
    This establishes control at verification time, not legal identity or permanent ownership.

    Start with GET /api/v1/tenant, create a verification, copy its code into the bio,
    then explicitly submit a verification attempt. Successful verification returns an account ID.
    Private profiles are supported when the provider supplies a usable username and bio.
    X and Facebook are known enum values but currently unsupported (422).

    All API operations require a backend-only tenant Bearer credential. The consuming backend
    must authorize its users and subject/resource IDs. Do not expose tenant keys in frontend code.
    Tenant IDs are inferred from the credential. Mutations reject Idempotency-Key headers;
    only creation accepts a body. Never log credentials or creation responses containing codes.
    Limits described here are defaults and can be configured by the operator.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 0.0.1-SNAPSHOT
servers:
- url: /
  description: This server
security:
- tenantKey: []
tags:
- name: Tenant
  description: Identify the application authenticated by a tenant API key.
- name: Social identities
  description: Read and revoke verified account associations.
- name: Verifications
  description: "Create, inspect, verify, and cancel bio verification requests."
paths:
  /api/v1/verifications:
    post:
      tags:
      - Verifications
      summary: Create a verification and return its code once
      description: "Does not call SearchAPI. Save the returned code and place it in\
        \ the profile bio before expiry (default: 15 minutes). GET cannot recover\
        \ the code. Duplicate active requests return 409. Default active limits: three\
        \ per subject and three per platform/handle. Idempotency-Key is unsupported."
      operationId: createVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVerificationRequest"
        required: true
      responses:
        "201":
          description: Created; plaintext code is returned only here
          headers:
            Location:
              description: Relative URI of the new verification
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCreatedResponse"
        default:
          description: Other HTTP failures use this problem shape (for example 405
            METHOD_NOT_ALLOWED).
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Bad Request
                status: 400
                code: INVALID_REQUEST
        "401":
          description: "Missing, invalid, expired, or revoked tenant key."
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer realm="mst-social"
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: UNAUTHORIZED
        "403":
          description: Authenticated principal lacks the required role.
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Forbidden
                status: 403
                code: FORBIDDEN
        "406":
          description: Requested response media type is unsupported.
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Not Acceptable
                status: 406
                code: NOT_ACCEPTABLE
        "500":
          description: Unexpected server failure; no internal details are returned.
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                code: INTERNAL_ERROR
        "503":
          description: STORAGE_UNAVAILABLE or AUTHENTICATION_UNAVAILABLE. Read status
            before retrying a mutation.
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Service Unavailable
                status: 503
                code: STORAGE_UNAVAILABLE
        "400":
          description: "INVALID_REQUEST (UUID/JSON), VALIDATION_FAILED (fields), INVALID_HANDLE,\
            \ UNEXPECTED_BODY, or IDEMPOTENCY_NOT_SUPPORTED."
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Bad Request
                status: 400
                code: INVALID_REQUEST
        "429":
          description: "Tenant rate limit exceeded (defaults per minute: create 10,\
            \ verify 10, read 120, mutate 30). Creation can also return ACTIVE_REQUEST_LIMIT_REACHED;\
            \ that error has no Retry-After."
          headers:
            Retry-After:
              description: Optional delay in seconds; present for tenant rate limits
                or a provider-supplied delay
              schema:
                type: integer
                format: int32
                minimum: 1
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                code: RATE_LIMIT_EXCEEDED
        "409":
          description: "An active request already exists for this subject, platform,\
            \ and handle."
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: DUPLICATE_ACTIVE_REQUEST
        "415":
          description: "Send Content-Type: application/json."
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Unsupported Media Type
                status: 415
                code: UNSUPPORTED_MEDIA_TYPE
        "422":
          description: Known platform without an enabled provider.
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: UNSUPPORTED_PLATFORM
  /api/v1/verifications/{id}/verify:
    post:
      tags:
      - Verifications
      summary: Verify the code against the public profile bio
      description: "Send no body (not even {}). One eligible attempt calls SearchAPI\
        \ once and may consume provider usage; there is no automatic retry. Private\
        \ profiles are allowed if their username and bio are available. Mismatches\
        \ 1–9 leave PENDING; mismatch 10 returns LOCKED (409). Provider failures do\
        \ not consume mismatch attempts. Success lasts one calendar year by default.\
        \ An already verified request returns its original association without a provider\
        \ call or extending validity; check account.active. Idempotency-Key is unsupported."
      operationId: verifyProfile
      parameters:
      - name: id
        in: path
        description: Resource UUID within the authenticated tenant
        required: true
        schema:
          type: string
          format: uuid
        example: 00000000-0000-4000-8000-000000000001
      responses:
        "200":
          description: VERIFIED or ALREADY_VERIFIED
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationAttemptResponse"
        default:
          description: Other HTTP failures use this problem shape (for example 405
            METHOD_NOT_ALLOWED).
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Bad Request
                status: 400
                code: INVALID_REQUEST
        "401":
          description: "Missing, invalid, expired, or revoked tenant key."
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer realm="mst-social"
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: UNAUTHORIZED
        "403":
          description: Authenticated principal lacks the required role.
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
