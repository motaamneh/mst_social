              example:
                type: about:blank
                title: Bad Request
                status: 400
                code: INVALID_REQUEST
        "429":
          description: "Tenant rate limit exceeded (defaults per minute: create 10,\
            \ verify 10, read 120, mutate 30). Creation can also return ACTIVE_REQUEST_LIMIT_REACHED;\
            \ that error has no Retry-After."
          headers:
            Retry-After:
              description: Optional delay in seconds; present for tenant rate limits
                or a provider-supplied delay
              schema:
                type: integer
                format: int32
                minimum: 1
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                code: RATE_LIMIT_EXCEEDED
        "404":
          description: Resource does not exist or belongs to another tenant; the response
            is identical.
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Not Found
                status: 404
                code: REQUEST_NOT_FOUND
        "409":
          description: "IN_PROGRESS, STALE_ATTEMPT, ACCOUNT_ALREADY_LINKED, CANCELED,\
            \ or LOCKED. Includes verification status."
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: LOCKED
        "410":
          description: Request expired; create a new one.
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Gone
                status: 410
                code: EXPIRED
        "422":
          description: "Code mismatch, or PROVIDER_FAILURE with PROFILE_NOT_FOUND,\
            \ PROFILE_UNAVAILABLE, or UNSUPPORTED_PLATFORM."
          headers:
            Retry-After:
              description: Optional delay in seconds; present for tenant rate limits
                or a provider-supplied delay
              schema:
                type: integer
                format: int32
                minimum: 1
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: CODE_NOT_FOUND
        "502":
          description: Provider authentication failed or the provider returned an
            invalid response.
          headers:
            Retry-After:
              description: Optional delay in seconds; present for tenant rate limits
                or a provider-supplied delay
              schema:
                type: integer
                format: int32
                minimum: 1
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Bad Gateway
                status: 502
                code: PROVIDER_FAILURE
                detail: The profile provider could not supply usable profile evidence.
                providerFailure:
                  retryable: false
                  reason: INVALID_PROVIDER_RESPONSE
        "504":
          description: Provider timed out; inspect providerFailure.retryable.
          headers:
            Retry-After:
              description: Optional delay in seconds; present for tenant rate limits
                or a provider-supplied delay
              schema:
                type: integer
                format: int32
                minimum: 1
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Gateway Timeout
                status: 504
                code: PROVIDER_FAILURE
                detail: The profile provider could not supply usable profile evidence.
                providerFailure:
                  retryable: true
                  reason: PROVIDER_TIMEOUT
  /api/v1/verifications/{id}:
