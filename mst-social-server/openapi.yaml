                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Forbidden
                status: 403
                code: FORBIDDEN
        "406":
          description: Requested response media type is unsupported.
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Not Acceptable
                status: 406
                code: NOT_ACCEPTABLE
        "500":
          description: Unexpected server failure; no internal details are returned.
          headers:
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                code: INTERNAL_ERROR
        "503":
          description: "Provider rate limited/error, STORAGE_UNAVAILABLE, or AUTHENTICATION_UNAVAILABLE.\
            \ Provider failures include providerFailure.reason and retryable; they\
            \ consume no mismatch attempts."
          headers:
            Retry-After:
              description: Optional delay in seconds; present for tenant rate limits
                or a provider-supplied delay
              schema:
                type: integer
                format: int32
                minimum: 1
            Cache-Control:
              description: Responses must not be cached
              schema:
                type: string
                example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                type: about:blank
                title: Service Unavailable
                status: 503
                code: PROVIDER_FAILURE
                detail: The profile provider could not supply usable profile evidence.
                providerFailure:
                  retryable: true
                  reason: PROVIDER_RATE_LIMITED
        "400":
          description: "INVALID_REQUEST (UUID/JSON), VALIDATION_FAILED (fields), INVALID_HANDLE,\
            \ UNEXPECTED_BODY, or IDEMPOTENCY_NOT_SUPPORTED."
          headers:
            Cache-Control:
